name: Upload Release to ToDus S3

on:
  release:
    types: [published]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download release asset
        run: |
          ASSET_URL=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.assets[0].browser_download_url')
          
          if [ "$ASSET_URL" = "null" ]; then
            echo "No asset found"
            exit 1
          else
            curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                 -H "Accept: application/octet-stream" \
                 "$ASSET_URL" -o Seend.apk
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to ToDus S3
        run: |
          curl -X PUT "https://s3.todus.cu/stream/Seend.apk" \
               --data-binary @Seend.apk
          
          echo ""
          echo "✅ APK subida exitosamente"
          echo "📥 Descargar: https://s3.todus.cu/stream/Seend.apk"
