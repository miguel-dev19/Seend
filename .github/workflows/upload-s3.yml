name: Upload Release to ToDus S3

on:
  release:
    types: [published]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Download release asset
        run: |
          echo "Obteniendo información del release..."
          
          RELEASE_DATA=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest)
          
          echo "Release data:"
          echo "$RELEASE_DATA" | jq '.'
          
          ASSET_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[0].browser_download_url')
          ASSET_NAME=$(echo "$RELEASE_DATA" | jq -r '.assets[0].name')
          
          echo "Asset URL: $ASSET_URL"
          echo "Asset Name: $ASSET_NAME"
          
          if [ "$ASSET_URL" = "null" ] || [ -z "$ASSET_URL" ]; then
            echo "❌ No se encontró ningún asset en el release"
            echo "Assets disponibles:"
            echo "$RELEASE_DATA" | jq '.assets'
            exit 1
          fi
          
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/octet-stream" \
               "$ASSET_URL" -o Seend.apk
          
          ls -la Seend.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to ToDus S3
        run: |
          echo "Subiendo a S3..."
          
          curl -v -X PUT "https://s3.todus.cu/stream/Seend.apk" \
               --data-binary @Seend.apk
          
          echo ""
          echo "✅ APK subida a: https://s3.todus.cu/stream/Seend.apk"
          
          # Verificar
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://s3.todus.cu/stream/Seend.apk")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Verificación: APK accesible (HTTP $HTTP_CODE)"
          else
            echo "⚠️ Verificación: HTTP $HTTP_CODE"
          fi
