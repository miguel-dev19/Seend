name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
      - run: gradle assembleDebug
      - run: mv app/build/outputs/apk/debug/app-debug.apk Seend-v0.4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Seend-APK
          path: Seend-v0.4.apk
      - name: Telegram
        run: |
          curl -F "chat_id=-1004422436595" \
               -F "document=@Seend-v0.4.apk" \
               -F "caption=Seend v0.4 - $(date +'%d/%m/%Y %H:%M')" \
               "https://api.telegram.org/bot8902019965:AAFDxMdmE972sLc4ppzeTOrnlphgBpz6DcI/sendDocument"
      - uses: softprops/action-gh-release@v2
        with:
          files: Seend-v0.4.apk
          tag_name: v0.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
