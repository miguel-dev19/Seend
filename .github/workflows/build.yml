name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2

    - name: Compilar APK Debug
      run: gradle assembleDebug

    - name: Subir APK como artifact
      uses: actions/upload-artifact@v4
      with:
        name: Seend-APK-v0.2
        path: app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
    - name: Descargar APK
      uses: actions/download-artifact@v4
      with:
        name: Seend-APK-v0.2

    - name: Crear Release
      uses: softprops/action-gh-release@v2
      with:
        files: app-debug.apk
        tag_name: v0.2
        name: "Seend v0.2 - Beta"
        body: |
          ## 🚀 Seend v0.2 - Beta
          
          ### 🔧 Cambios:
          - Estados de conexión en barra superior
          - Flujo completo de mensajes (enviando → enviado → entregado → leído)
          - Botón enviar solo visible al escribir
          - Correcciones de UI
          
          ### ✅ Funcionalidades:
          - 🔐 Registro/Login con JWT
          - 💬 Chat en tiempo real (WebSocket)
          - 🕐✓✓✓✓ Estados de mensajes
          - ✍️ Indicador "Escribiendo..."
          - 📸 Fotos de perfil (plan ToDus)
          - 📴 Modo offline (Room SQLite)
          - 🔄 Sincronización automática
          
          📡 Servidor: seend-server.onrender.com
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
