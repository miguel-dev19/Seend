name: Build, Release y Telegram

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with: {distribution: 'temurin', java-version: '17'}
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with: {gradle-version: '8.2'}
    - name: Compilar APK
      run: gradle assembleDebug
    - name: Renombrar APK
      run: mv app/build/outputs/apk/debug/app-debug.apk Seend-v0.3.apk
    - name: Subir artifact
      uses: actions/upload-artifact@v4
      with: {name: Seend-APK, path: Seend-v0.3.apk}
    - name: Enviar a Telegram
      env:
        TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      run: |
        curl -F "chat_id=$CHAT" -F "document=@Seend-v0.3.apk" \
          -F "caption=🚀 Seend v0.3%0A📅 $(date +'%d/%m/%Y %H:%M')%0A🔗 github.com/miguel-dev19/Seend" \
          "https://api.telegram.org/bot$TOKEN/sendDocument"
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
    - uses: actions/download-artifact@v4
      with: {name: Seend-APK}
    - uses: softprops/action-gh-release@v2
      with: {files: Seend-v0.3.apk, tag_name: v0.3}
      env: {GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}}
